name: Build daily brief

on:
  # Every ~3 hours across the U.S. trading day, weekdays only.
  # Cron is UTC: 8-23/3 = 8,11,14,17,20,23 UTC ≈ 3 AM–6 PM Central.
  # (UTC does not shift with daylight saving, so the local times drift an hour
  # between summer and winter — still fine for market coverage.)
  schedule:
    - cron: "0 8-23/3 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the brief
        env:
          # Add a free FRED key as a repo secret (FRED_API_KEY) to auto-update
          # the macro tiles. Without it, the build still works and those tiles
          # use their snapshot values.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build.py

      - name: Commit updated page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/fallback.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily brief: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
