name: Build daily brief

on:
  # Weekday mornings. Cron is UTC: 11:30 UTC ≈ 6:30 AM Central (CDT) / 5:30 AM (CST).
  # Adjust the hour if you want it earlier/later; note UTC does not shift with US DST.
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}      # lets you run it on demand from the Actions tab

# Allow the workflow to commit the regenerated page back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the brief
        env:
          # Optional: add a free FRED key as a repo secret to auto-update the
          # macro tiles (Fed funds, CPI, core PCE, GDP). Without it the build
          # still works and those tiles use their snapshot values.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build.py

      - name: Commit updated page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/fallback.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily brief: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
