name: Build daily brief

on:
  # Every ~3 hours across the U.S. trading day, weekdays only.
  # Cron is UTC: 8-23/3 = 8,11,14,17,20,23 UTC ≈ 3 AM–6 PM Central.
  # (UTC does not shift with daylight saving, so local times drift an hour
  # between summer and winter — still fine for market coverage.)
  schedule:
    - cron: "0 8-23/3 * * 1-5"   # every ~3 hours across the trading day (weekdays)
    - cron: "50 13 * * 1-5"      # post-open build at 13:50 UTC (~9:50 AM ET during EDT) — 15-min
                                 # Yahoo delay has caught up to the 9:30 open by then; this is the
                                 # build the email digest sends from (DIGEST_HOUR_UTC=13)
  workflow_dispatch: {}      # run on demand from the Actions tab (also always emails the digest)

# Allow the workflow to commit the regenerated page back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the brief
        env:
          # FRED key (repo secret) auto-updates the macro + spread + CRE tiles.
          # Without it the build still works and those tiles use snapshot values.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build.py

      - name: Send email digest (optional)
        env:
          # All optional. Set DIGEST_TO + SMTP_USER + SMTP_PASS as repo secrets
          # to turn the morning email on; leave unset to skip it silently.
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          # Send the digest only when the market-open cron triggered this run, or
          # on a manual run — one email per morning at the open. This gates on the
          # TRIGGERING cron (github.event.schedule), which is robust to GitHub
          # firing the scheduled build late; keep DIGEST_CRON identical to the
          # post-open cron in the schedule above ("50 13 * * 1-5").
          DIGEST_CRON: "50 13 * * 1-5"
          SCHEDULE_TRIGGER: ${{ github.event.schedule }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python email_digest.py

      - name: Commit updated page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily brief: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
